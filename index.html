<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<title>Achille Lauro — Firma</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

button {
    font-family: inherit;
}

/* SCHERMATE */

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}


/* =========================
   HOME
========================= */

#home {

    align-items: center;
    justify-content: flex-end;

    background-image:

        linear-gradient(
            90deg,
            rgba(0,0,0,0.05) 0%,
            rgba(0,0,0,0.05) 35%,
            rgba(0,0,0,0.35) 55%,
            rgba(0,0,0,0.88) 80%,
            #000 100%
        ),

        url("./lauro.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.homeContent {

    width: 45%;
    padding-right: 7vw;

    display: flex;
    flex-direction: column;
    justify-content: center;

    z-index: 2;
}

.event {

    font-size: 13px;
    font-weight: bold;
    letter-spacing: 5px;

    margin-bottom: 20px;

    opacity: .75;
}

.logo {

    font-family: Georgia, serif;

    font-size: clamp(60px, 7vw, 105px);

    font-weight: 900;

    line-height: .78;

    letter-spacing: -6px;

    margin-bottom: 35px;
}

.logo span {
    display: block;
}

.location {

    font-size: 19px;

    letter-spacing: 1px;

    opacity: .65;

    margin-bottom: 55px;
}

.firmaButton {

    height: 80px;

    background: white;
    color: black;

    border: none;
    border-radius: 4px;

    font-size: 20px;
    font-weight: 900;

    letter-spacing: 3px;

    cursor: pointer;
}


/* =========================
   FORM
========================= */

#form {

    background: #050505;

    flex-direction: column;

    padding:
        max(25px, env(safe-area-inset-top))
        max(55px, env(safe-area-inset-right))
        max(25px, env(safe-area-inset-bottom))
        max(55px, env(safe-area-inset-left));
}


.topbar {

    height: 60px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid #222;
}


.back {

    background: transparent;

    border: none;

    color: #777;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 2px;
}


.smallLogo {

    font-family: Georgia, serif;

    font-weight: 900;

    font-size: 20px;
}


.formContent {

    width: min(100%, 1000px);

    margin: auto;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


h1 {

    margin: 0 0 5px;

    font-size: clamp(42px, 5vw, 68px);

    letter-spacing: -3px;
}


.description {

    color: #777;

    font-size: 16px;

    margin-bottom: 30px;
}


.names {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-bottom: 25px;
}


.field label {

    display: block;

    color: #777;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 8px;
}


.field input {

    width: 100%;

    height: 58px;

    background: #111;

    border: 1px solid #333;

    border-radius: 4px;

    color: white;

    padding: 0 18px;

    font-size: 20px;

    outline: none;
}


.field input:focus {
    border-color: #888;
}


/* FIRMA */

.signatureHeader {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #777;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 8px;
}


.clear {

    background: transparent;

    border: none;

    color: #777;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;
}


.signatureBox {

    height: 220px;

    position: relative;

    background: #000;

    border: 1px solid #333;

    border-radius: 4px;

    overflow: hidden;

    margin-bottom: 20px;
}


canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    touch-action: none;
}


.hint {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #222;

    font-size: 17px;

    letter-spacing: 4px;

    pointer-events: none;
}


.save {

    height: 65px;

    background: white;

    color: black;

    border: none;

    border-radius: 4px;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 3px;
}


/* =========================
   CONFERMA
========================= */

#success {

    background: #000;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


.check {

    width: 80px;
    height: 80px;

    border: 2px solid white;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 35px;

    margin-bottom: 30px;
}


#success h2 {

    margin: 0;

    font-size: 48px;
}


#success p {

    color: #777;

    font-size: 17px;
}


/* =========================
   BLOCCO VERTICALE
========================= */

#rotate {

    display: none;

    position: fixed;

    inset: 0;

    background: black;

    z-index: 999999;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;
}


.rotateIcon {

    font-size: 60px;

    margin-bottom: 30px;
}


#rotate strong {

    font-size: 22px;

    letter-spacing: 4px;
}


@media (orientation: portrait) {

    #rotate {
        display: flex;
    }

}

</style>
</head>


<body>


<!-- RUOTA IPAD -->

<div id="rotate">

    <div class="rotateIcon">↻</div>

    <strong>RUOTA L'iPAD</strong>

</div>



<!-- ======================
     HOME
======================= -->

<section id="home" class="screen active">

    <div class="homeContent">

        <div class="event">
            FAN GATHERING
        </div>

        <div class="logo">

            <span>ACHILLE</span>

            <span>LAURO</span>

        </div>

        <div class="location">
            ALLIANZ CLOUD · MILANO
        </div>

        <button
        class="firmaButton"
        onclick="openForm()">

            FIRMA →

        </button>

    </div>

</section>



<!-- ======================
     FORM
======================= -->

<section id="form" class="screen">


    <div class="topbar">

        <button
        class="back"
        onclick="goHome()">

            ← INDIETRO

        </button>


        <div class="smallLogo">

            ACHILLE LAURO

        </div>

    </div>



    <div class="formContent">


        <h1>
            Lascia la tua firma
        </h1>


        <div class="description">

            Inserisci il tuo nome e firma nello spazio sottostante.

        </div>



        <div class="names">


            <div class="field">

                <label>NOME</label>

                <input
                id="nome"
                type="text"
                placeholder="Nome"
                autocomplete="off">

            </div>



            <div class="field">

                <label>COGNOME</label>

                <input
                id="cognome"
                type="text"
                placeholder="Cognome"
                autocomplete="off">

            </div>


        </div>



        <div class="signatureHeader">

            <span>FIRMA</span>

            <button
            class="clear"
            onclick="clearSignature()">

                CANCELLA

            </button>

        </div>



        <div class="signatureBox">


            <div
            id="hint"
            class="hint">

                FIRMA QUI

            </div>


            <canvas id="signature"></canvas>


        </div>



        <button
        class="save"
        onclick="saveSignature()">

            SALVA FIRMA →

        </button>


    </div>


</section>



<!-- ======================
     SUCCESS
======================= -->

<section id="success" class="screen">


    <div class="check">
        ✓
    </div>


    <h2>
        Firma salvata
    </h2>


    <p>
        Grazie
    </p>


</section>



<script>


const home =
document.getElementById("home");


const form =
document.getElementById("form");


const success =
document.getElementById("success");


const canvas =
document.getElementById("signature");


const ctx =
canvas.getContext("2d");


const hint =
document.getElementById("hint");


let drawing = false;

let signed = false;



/* CAMBIO SCHERMATA */

function show(screen) {

    document
    .querySelectorAll(".screen")
    .forEach(el =>
        el.classList.remove("active")
    );

    screen.classList.add("active");

}



/* HOME -> FIRMA */

function openForm() {

    show(form);

    setTimeout(
        prepareCanvas,
        50
    );

}



/* TORNA HOME */

function goHome() {

    reset();

    show(home);

}



/* PREPARA CANVAS */

function prepareCanvas() {

    const rect =
    canvas.getBoundingClientRect();


    const ratio =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * ratio;


    canvas.height =
    rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    ctx.strokeStyle =
    "#ffffff";


    ctx.lineWidth = 3;


    ctx.lineCap =
    "round";


    ctx.lineJoin =
    "round";

}



/* POSIZIONE PENNA */

function getPosition(e) {

    const rect =
    canvas.getBoundingClientRect();


    return {

        x:
        e.clientX -
        rect.left,

        y:
        e.clientY -
        rect.top

    };

}



/* INIZIO FIRMA */

canvas.addEventListener(
"pointerdown",
function(e) {

    e.preventDefault();


    drawing = true;

    signed = true;


    hint.style.display =
    "none";


    const p =
    getPosition(e);


    ctx.beginPath();

    ctx.moveTo(
        p.x,
        p.y
    );


    if (
        canvas.setPointerCapture
    ) {

        canvas.setPointerCapture(
            e.pointerId
        );

    }

});



/* DISEGNO */

canvas.addEventListener(
"pointermove",
function(e) {

    if (!drawing)
        return;


    e.preventDefault();


    const p =
    getPosition(e);


    ctx.lineTo(
        p.x,
        p.y
    );


    ctx.stroke();

});



/* FINE FIRMA */

canvas.addEventListener(
"pointerup",
function() {

    drawing = false;

});


canvas.addEventListener(
"pointercancel",
function() {

    drawing = false;

});



/* CANCELLA */

function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    signed = false;


    hint.style.display =
    "block";

}



/* SALVA */

function saveSignature() {


    const nome =
    document
    .getElementById("nome")
    .value
    .trim();


    const cognome =
    document
    .getElementById("cognome")
    .value
    .trim();



    if (!nome) {

        alert(
            "Inserisci il nome."
        );

        return;

    }


    if (!cognome) {

        alert(
            "Inserisci il cognome."
        );

        return;

    }


    if (!signed) {

        alert(
            "Inserisci la firma."
        );

        return;

    }



    const record = {

        nome: nome,

        cognome: cognome,

        firma:
        canvas.toDataURL(
            "image/png"
        ),

        data:
        new Date()
        .toISOString()

    };



    const archivio =

    JSON.parse(

        localStorage
        .getItem(
            "lauroSignatures"
        )

        || "[]"

    );



    archivio.push(
        record
    );



    localStorage.setItem(

        "lauroSignatures",

        JSON.stringify(
            archivio
        )

    );



    show(success);



    setTimeout(
        function() {

            reset();

            show(home);

        },

        2200
    );

}



/* RESET */

function reset() {

    document
    .getElementById("nome")
    .value = "";


    document
    .getElementById("cognome")
    .value = "";


    clearSignature();

}



/* ROTAZIONE / RESIZE */

window.addEventListener(
"resize",
function() {

    if (
        form.classList
        .contains("active")
    ) {

        prepareCanvas();

    }

});


</script>

</body>
</html>
