<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<title>Achille Lauro — Fan Gathering</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;
}

button, input {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}


/* ==================================================
   HOME
================================================== */

#home {
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(0,0,0,.08),
            rgba(0,0,0,.18)
        ),
        url("./lauro.jpg");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

#home::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 15%,
            rgba(0,0,0,.10) 45%,
            rgba(0,0,0,.72) 100%
        );

    pointer-events: none;
}

.homeContent {
    position: relative;
    z-index: 2;

    width: min(720px, 62vw);
    height: 100%;

    padding:
        max(35px, env(safe-area-inset-top))
        30px
        max(40px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;

    text-align: center;
}

.topEvent {
    margin-top: 1vh;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 7px;

    text-transform: uppercase;

    opacity: .75;
}

.heroText {
    margin-top: auto;
    margin-bottom: 3vh;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    margin: 0;

    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(54px, 6.5vw, 92px);

    line-height: .80;

    font-weight: 400;

    letter-spacing: -4px;

    text-shadow: 0 3px 30px rgba(0,0,0,.9);
}

.logo span {
    display: block;
}

.location {
    margin-top: 25px;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 6px;

    opacity: .8;
}


/* ==================================================
   SLIDER
================================================== */

.sliderArea {
    width: min(480px, 70vw);

    margin-bottom: 2vh;
}

.slider {
    position: relative;

    width: 100%;
    height: 74px;

    border: 1px solid rgba(255,255,255,.45);

    border-radius: 100px;

    background: rgba(0,0,0,.52);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    overflow: hidden;

    user-select: none;
    touch-action: none;
}

.sliderText {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-left: 45px;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 5px;

    color: rgba(255,255,255,.85);

    pointer-events: none;

    transition: opacity .2s;
}

.sliderArrow {
    position: absolute;

    left: 7px;
    top: 7px;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #fff;
    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: 300;

    cursor: grab;

    z-index: 3;

    box-shadow: 0 3px 20px rgba(0,0,0,.35);

    transform: translateX(0);

    will-change: transform;
}

.sliderArrow:active {
    cursor: grabbing;
}

.sliderProgress {
    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 0;

    background: rgba(255,255,255,.10);

    pointer-events: none;
}


/* ==================================================
   FORM
================================================== */

#formScreen {
    background: #050505;

    flex-direction: column;

    padding:
        max(22px, env(safe-area-inset-top))
        max(50px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(50px, env(safe-area-inset-left));
}

.topbar {
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #1c1c1c;
}

.back {
    border: 0;
    background: transparent;

    color: #666;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 2px;

    padding: 15px 0;
}

.smallLogo {
    font-family: Georgia, serif;

    font-size: 20px;

    letter-spacing: -1px;
}

.formContent {
    flex: 1;

    width: min(920px, 88vw);

    margin: auto;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.formTitle {
    margin: 0 0 5px;

    text-align: center;

    font-family: Georgia, serif;

    font-size: clamp(38px, 4vw, 58px);

    font-weight: 400;

    letter-spacing: -2px;
}

.description {
    text-align: center;

    color: #666;

    font-size: 14px;

    margin-bottom: 28px;
}

.names {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;

    margin-bottom: 22px;
}

.field label,
.signatureHeader {
    color: #666;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 3px;
}

.field label {
    display: block;

    margin-bottom: 8px;
}

.field input {
    width: 100%;
    height: 55px;

    background: #0d0d0d;

    border: 1px solid #292929;
    border-radius: 5px;

    outline: none;

    color: #fff;

    padding: 0 18px;

    font-size: 18px;
}

.field input:focus {
    border-color: #777;
}

.signatureHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 8px;
}

.clear {
    border: 0;

    background: transparent;

    color: #777;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 2px;

    padding: 8px 0;
}

.signatureBox {
    position: relative;

    width: 100%;
    height: min(220px, 27vh);

    background: #000;

    border: 1px solid #292929;
    border-radius: 5px;

    overflow: hidden;

    margin-bottom: 18px;
}

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    touch-action: none;
}

.signatureHint {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #242424;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 5px;

    pointer-events: none;
}

.save {
    height: 60px;

    border: 0;
    border-radius: 100px;

    background: #fff;
    color: #000;

    font-size: 12px;
    font-weight: 800;

    letter-spacing: 4px;
}


/* ==================================================
   SUCCESS
================================================== */

#success {
    background: #000;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.check {
    width: 72px;
    height: 72px;

    border: 1px solid #fff;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 25px;

    font-size: 28px;
}

#success h2 {
    margin: 0;

    font-family: Georgia, serif;

    font-size: 45px;

    font-weight: 400;
}

#success p {
    color: #666;

    font-size: 14px;

    letter-spacing: 3px;
}


/* ==================================================
   PORTRAIT
================================================== */

#rotate {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 99999;

    background: #000;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.rotateIcon {
    font-size: 50px;

    margin-bottom: 25px;
}

#rotate span {
    font-size: 13px;

    font-weight: 700;

    letter-spacing: 5px;
}

@media (orientation: portrait) {

    #rotate {
        display: flex;
    }

}

</style>
</head>

<body>


<div id="rotate">

    <div class="rotateIcon">↻</div>

    <span>RUOTA L'iPAD</span>

</div>


<!-- HOME -->

<section id="home" class="screen active">

    <div class="homeContent">

        <div class="topEvent">
            FAN GATHERING
        </div>


        <div class="heroText">

            <h1 class="logo">
                <span>ACHILLE</span>
                <span>LAURO</span>
            </h1>

            <div class="location">
                ALLIANZ CLOUD · MILANO
            </div>

        </div>


        <div class="sliderArea">

            <div
                id="slider"
                class="slider">

                <div
                    id="sliderProgress"
                    class="sliderProgress">
                </div>

                <div
                    id="sliderText"
                    class="sliderText">
                    SCORRI PER FIRMARE
                </div>

                <div
                    id="sliderArrow"
                    class="sliderArrow">
                    →
                </div>

            </div>

        </div>

    </div>

</section>


<!-- FIRMA -->

<section
    id="formScreen"
    class="screen">

    <div class="topbar">

        <button
            class="back"
            onclick="goHome()">
            ← INDIETRO
        </button>

        <div class="smallLogo">
            ACHILLE LAURO
        </div>

    </div>


    <div class="formContent">

        <h1 class="formTitle">
            Lascia la tua firma
        </h1>

        <div class="description">
            Un segno di questo giorno.
        </div>


        <div class="names">

            <div class="field">

                <label>NOME</label>

                <input
                    id="nome"
                    type="text"
                    autocomplete="off"
                    placeholder="Nome">

            </div>


            <div class="field">

                <label>COGNOME</label>

                <input
                    id="cognome"
                    type="text"
                    autocomplete="off"
                    placeholder="Cognome">

            </div>

        </div>


        <div class="signatureHeader">

            <span>LA TUA FIRMA</span>

            <button
                class="clear"
                onclick="clearSignature()">
                CANCELLA
            </button>

        </div>


        <div class="signatureBox">

            <div
                id="signatureHint"
                class="signatureHint">
                FIRMA QUI
            </div>

            <canvas id="signature"></canvas>

        </div>


        <button
            class="save"
            onclick="saveSignature()">

            SALVA FIRMA

        </button>

    </div>

</section>


<!-- SUCCESS -->

<section
    id="success"
    class="screen">

    <div class="check">
        ✓
    </div>

    <h2>Grazie.</h2>

    <p>LA TUA FIRMA È STATA SALVATA</p>

</section>


<script>

/* ==================================================
   SCHERMATE
================================================== */

const home =
    document.getElementById("home");

const formScreen =
    document.getElementById("formScreen");

const success =
    document.getElementById("success");


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(s =>
            s.classList.remove("active")
        );

    screen.classList.add("active");

}


function openForm() {

    showScreen(formScreen);

    setTimeout(
        prepareCanvas,
        50
    );

}


function goHome() {

    resetForm();

    resetSlider();

    showScreen(home);

}


/* ==================================================
   SLIDER
================================================== */

const slider =
    document.getElementById("slider");

const sliderArrow =
    document.getElementById("sliderArrow");

const sliderProgress =
    document.getElementById("sliderProgress");

const sliderText =
    document.getElementById("sliderText");


let sliding = false;

let startX = 0;

let currentX = 0;


function sliderMax() {

    return (
        slider.clientWidth -
        sliderArrow.offsetWidth -
        14
    );

}


sliderArrow.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        sliding = true;

        startX =
            e.clientX -
            currentX;

        sliderArrow.setPointerCapture(
            e.pointerId
        );

    }
);


sliderArrow.addEventListener(
    "pointermove",
    e => {

        if (!sliding)
            return;

        e.preventDefault();

        const max =
            sliderMax();


        let x =
            e.clientX -
            startX;


        x =
            Math.max(
                0,
                Math.min(
                    x,
                    max
                )
            );


        currentX = x;


        sliderArrow.style.transform =
            `translateX(${x}px)`;


        sliderProgress.style.width =
            `${x + 65}px`;


        const percentage =
            x / max;


        sliderText.style.opacity =
            1 - percentage;


        if (percentage > .88) {

            sliding = false;

            currentX = max;

            sliderArrow.style.transform =
                `translateX(${max}px)`;


            setTimeout(
                () => {

                    openForm();

                    resetSlider();

                },
                130
            );

        }

    }
);


sliderArrow.addEventListener(
    "pointerup",
    () => {

        if (!sliding)
            return;

        sliding = false;

        resetSlider();

    }
);


sliderArrow.addEventListener(
    "pointercancel",
    () => {

        sliding = false;

        resetSlider();

    }
);


function resetSlider() {

    currentX = 0;

    sliderArrow.style.transition =
        "transform .28s ease";

    sliderProgress.style.transition =
        "width .28s ease";

    sliderArrow.style.transform =
        "translateX(0)";

    sliderProgress.style.width =
        "0";

    sliderText.style.opacity =
        "1";


    setTimeout(
        () => {

            sliderArrow.style.transition =
                "none";

            sliderProgress.style.transition =
                "none";

        },
        300
    );

}


/* ==================================================
   FIRMA
================================================== */

const canvas =
    document.getElementById("signature");

const ctx =
    canvas.getContext("2d");

const signatureHint =
    document.getElementById("signatureHint");


let drawing = false;

let signed = false;


function prepareCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        3;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

}


function getPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            e.clientX -
            rect.left,

        y:
            e.clientY -
            rect.top

    };

}


canvas.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        drawing = true;

        signed = true;

        signatureHint.style.display =
            "none";


        const p =
            getPosition(e);


        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y
        );


        if (
            canvas.setPointerCapture
        ) {

            canvas.setPointerCapture(
                e.pointerId
            );

        }

    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        if (!drawing)
            return;

        e.preventDefault();


        const p =
            getPosition(e);


        ctx.lineTo(
            p.x,
            p.y
        );

        ctx.stroke();

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        drawing = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        drawing = false;

    }
);


function clearSignature() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    signed = false;

    signatureHint.style.display =
        "block";

}


/* ==================================================
   SALVATAGGIO
================================================== */

function saveSignature() {

    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const cognome =
        document
        .getElementById("cognome")
        .value
        .trim();


    if (!nome) {

        alert("Inserisci il nome.");

        return;

    }


    if (!cognome) {

        alert("Inserisci il cognome.");

        return;

    }


    if (!signed) {

        alert("Inserisci la firma.");

        return;

    }


    const record = {

        nome,

        cognome,

        firma:
            canvas.toDataURL(
                "image/png"
            ),

        data:
            new Date()
            .toISOString()

    };


    const archivio =
        JSON.parse(
            localStorage.getItem(
                "lauroSignatures"
            ) || "[]"
        );


    archivio.push(record);


    localStorage.setItem(
        "lauroSignatures",
        JSON.stringify(
            archivio
        )
    );


    showScreen(success);


    setTimeout(
        () => {

            resetForm();

            resetSlider();

            showScreen(home);

        },
        2200
    );

}


/* ==================================================
   RESET
================================================== */

function resetForm() {

    document
        .getElementById("nome")
        .value = "";


    document
        .getElementById("cognome")
        .value = "";


    clearSignature();

}


window.addEventListener(
    "resize",
    () => {

        if (
            formScreen
            .classList
            .contains("active")
        ) {

            prepareCanvas();

        }

    }
);

</script>

</body>
</html>
